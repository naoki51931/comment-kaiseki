server {
    listen 80;
    server_name kifu-comment-lab.com www.kifu-comment-lab.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://kifu-comment-lab.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.kifu-comment-lab.com;

    ssl_certificate /etc/letsencrypt/live/kifu-comment-lab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kifu-comment-lab.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://kifu-comment-lab.com$request_uri;
}

server {
    listen 443 ssl;
    server_name kifu-comment-lab.com;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 3m;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/kifu-comment-lab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kifu-comment-lab.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
